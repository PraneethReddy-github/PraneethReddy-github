name: Update Profile SVGs

on:
  schedule:
    - cron: "7 */2 * * *" # Every 2 hours, so the visitor total stays fresh
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - 'build_profile_svg.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run SVG build script
        run: python build_profile_svg.py
        
      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.svg cards/
          # Only commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          # Check if last commit was by the bot
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          if [ "$LAST_AUTHOR" == "github-actions[bot]" ]; then
            echo "Amending previous bot commit..."
            git commit --amend --no-edit
            git push --force
          else
            echo "Creating new bot commit..."
            git commit -m "chore: auto-update profile SVGs [skip ci]"
            git push
          fi
