<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Profile Header Preview</title>
  <style>
    body {
      background-color: #05070B;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
    }
    img {
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../assets/svg/dark.svg" width="100%" alt="Dark Mode Terminal Profile">
    <br><br>
    <img src="../assets/svg/github_stats.svg" width="100%" alt="Retro Terminal GitHub Stats">
    <br><br>
    <img src="../assets/svg/repos.svg" width="100%" alt="Recent Repositories">
    <br><br>
    <img src="../assets/svg/snake.svg" width="100%" alt="Contribution Snake">
    <br><br>
    <img src="../assets/img/cat-eyes.gif" width="100%" alt="Cyber Cat Eyes" style="border: 1px solid #1E293B;">
    <br><br>
    <img src="../assets/svg/visitor_counter.svg" width="100%" alt="Full Width Consistent Visitor Counter">
  </div>
</body>
</html>
