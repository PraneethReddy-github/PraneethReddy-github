<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="406" viewBox="0 0 1000 406">
<defs>
  <radialGradient id="repoBgGlow" cx="50%" cy="12%" r="88%">
    <stop offset="0%" stop-color="#0C0F17"/>
    <stop offset="100%" stop-color="#020305"/>
  </radialGradient>

  <pattern id="repoScanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#FFFFFF" opacity="0.025"/>
  </pattern>

  
<!-- RETRO PHOSPHOR GLOW -->
<filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
    <feFlood flood-color="#20DFFF" flood-opacity="0.38" result="cyanGlow"/>
    <feComposite in="cyanGlow" in2="blur2" operator="in" result="cyanComposite"/>
    <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="cyanComposite"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>






  <style>
    @keyframes repoIn {
      0%   { opacity: 0; transform: translateX(-14px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .term-title { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Mono', 'Courier New', monospace; font-size: 12.5px; fill: #64748B; letter-spacing: 0.5px; font-weight: bold; }
    .repo-arrow { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Mono', 'Courier New', monospace; font-size: 13px; fill: #34D399; }
    .repo-name  { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Mono', 'Courier New', monospace; font-size: 15px; fill: #38BDF8; font-weight: bold; letter-spacing: 0.4px; }
    .repo-meta  { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Mono', 'Courier New', monospace; font-size: 11.5px; fill: #94A3B8; }
    .repo-desc  { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Mono', 'Courier New', monospace; font-size: 11.5px; fill: #64748B; }
  </style>
</defs>

